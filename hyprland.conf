# Hyprland Configuration
# Fixed from mixed Lua/native syntax errors

$mainMod = SUPER
$terminal =  kitty fish -c "neofetch; fish"
$fileManager = nautilus
$menu =  rofi -show drun
#$menu = hyprlauncher
exec-once = swaybg -i /home/fokhrul/Pictures/wallpapers/e.png -m fill
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal
exec-once = waybar
exec-once = hyprlauncher -d
exec-once = hyprpaper

# Monitor - Dell Latitude 5420 (1920x1080)
monitor=eDP-1,1920x1080@60,0x0,1




env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE,2
env = ELECTRON_OZONE_PLATFORM_HINT,auto



# ── Look and Feel ──────────────────────────────────────────

general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(33cceeee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

animations {
    enabled = true
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    gesture = 3, horizontal, workspace   # 3-finger swipe left/right = change workspace
    gesture = 3, up, fullscreen          # 3-finger swipe up = fullscreen
    gesture = 3, down, close             # 3-finger swipe down = close window
}

# ── Keybinds ───────────────────────────────────────────────
bind = $mainMod, P, exec, ~/toggle-power.sh
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, brave
bind = $mainMod, L, exec, localsend
bind = $mainMod, D, exec, libreoffice
bind = $mainMod, T, exec, virtualbox
bind = $mainMod, C, exec, chromium
bind = $mainMod, A, exec, chromium --app="https://chatgpt.com"
bind = $mainMod, H, exec, chromium --app="https://huggingface.co/chat/"
bind = $mainMod, G, exec, chromium --app="https://github.com/"
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, K, exec, kitty fish -c "cat ~/.config/hypr/keybinds.txt; echo; read -P 'Press Enter to close...'"
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# Volume Controls (requires wireplumber)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness Controls (requires brightnessctl)
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Lid close → suspend
bindl = , switch:on:Lid Switch, exec, systemctl suspend
# Screenshots
bind = , Print, exec, grimblast copy area          # select region → clipboard
bind = SUPER, Print, exec, grimblast copy screen   # full screen → clipboard
bind = SUPER SHIFT, Print, exec, grimblast save area ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
